<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Include system fontconfig rules, then disable LCD subpixel RGB
       antialiasing for headless offscreen Qt tests so black/themed text
       does not emit colored RGB fringes onto Format_RGB32 test grabs. -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="font">
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
